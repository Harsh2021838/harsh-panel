# Publishes a GitHub release for each new version.
# On every push to main: if package.json's version has no release yet, build the panel
# and publish release v<version> with Harsh-*.zip attached. The panel's updater reads
# the newest release here and downloads that zip.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Already released?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; echo "v${{ steps.v.outputs.version }} is already released."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'false'
        with:
          node-version: 20
          cache: npm
      - name: Build
        if: steps.check.outputs.exists == 'false'
        run: |
          V=${{ steps.v.outputs.version }}
          grep -q "ExtensionBundleVersion=\"$V\"" static/CSXS/manifest.xml || { echo "static/CSXS/manifest.xml isn't $V"; exit 1; }
          grep -q "const VERSION = \"$V\"" src/main.jsx || { echo "VERSION in src/main.jsx isn't $V"; exit 1; }
          npm ci
          npm run build
      - name: Publish release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.v.outputs.version }}
          gh release create "v$V" dist/Harsh-*.zip --target "$GITHUB_SHA" \
            --title "Harsh $V" \
            --notes "Install: unzip and run the installer, or let the panel update itself (Settings > Updates)."
